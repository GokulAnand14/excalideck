name: "Release & Multi-Platform Build"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: ""
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            args: ""
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Excalideck v__VERSION__"
          releaseBody: |
            ## Excalideck Release v__VERSION__

            ### What's New:
            - **Local Vault Storage**: Obsidian-style directory management for `.excalidraw` sketches.
            - **Zero-Latency In-Memory Transitions**: Instant switching between drawings without canvas teardown.
            - **Atomic Background Auto-Save & Asset Extraction**: Automatic deduplication and safe writes in Rust.
            - **Virtual Pointer Drag & Drop**: Smooth organization into subfolders with custom modals.
            - **Refined Frameless UI**: Authentic macOS controls and dark/light themes.

            ### Downloads:
            Download the installer corresponding to your operating system below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
